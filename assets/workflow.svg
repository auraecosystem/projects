<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
<title id="title">Aura Projects contribution workflow</title><desc id="desc">A five-step workflow from idea to documented implementation.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b18"/><stop offset="1" stop-color="#12132d"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
<rect width="1400" height="430" rx="32" fill="url(#bg)"/>
<text x="70" y="75" fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="34" font-weight="800">Aura Development Flow</text>
<text x="70" y="108" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="17">A repeatable path from an idea to a verified, documented change.</text>
<g stroke="url(#accent)" stroke-width="4" fill="none"><path d="M260 230H350"/><path d="M520 230H610"/><path d="M780 230H870"/><path d="M1040 230H1130"/></g>
<g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
 <g><rect x="70" y="160" width="190" height="140" rx="22" fill="#111827" stroke="#38bdf8"/><text x="165" y="215" fill="#7dd3fc" font-size="22" font-weight="700">01</text><text x="165" y="252" fill="#fff" font-size="19">Explore</text><text x="165" y="277" fill="#64748b" font-size="13">inspect reality</text></g>
 <g><rect x="350" y="160" width="170" height="140" rx="22" fill="#111827" stroke="#818cf8"/><text x="435" y="215" fill="#a5b4fc" font-size="22" font-weight="700">02</text><text x="435" y="252" fill="#fff" font-size="19">Design</text><text x="435" y="277" fill="#64748b" font-size="13">choose structure</text></g>
 <g><rect x="610" y="160" width="170" height="140" rx="22" fill="#111827" stroke="#8b5cf6"/><text x="695" y="215" fill="#c4b5fd" font-size="22" font-weight="700">03</text><text x="695" y="252" fill="#fff" font-size="19">Build</text><text x="695" y="277" fill="#64748b" font-size="13">make the change</text></g>
 <g><rect x="870" y="160" width="170" height="140" rx="22" fill="#111827" stroke="#22d3ee"/><text x="955" y="215" fill="#67e8f9" font-size="22" font-weight="700">04</text><text x="955" y="252" fill="#fff" font-size="19">Verify</text><text x="955" y="277" fill="#64748b" font-size="13">test the result</text></g>
 <g><rect x="1130" y="160" width="200" height="140" rx="22" fill="#111827" stroke="#38bdf8"/><text x="1230" y="215" fill="#7dd3fc" font-size="22" font-weight="700">05</text><text x="1230" y="252" fill="#fff" font-size="19">Document</text><text x="1230" y="277" fill="#64748b" font-size="13">make it discoverable</text></g>
</g>
<text x="700" y="365" fill="#64748b" font-family="Inter,system-ui,sans-serif" font-size="14" text-anchor="middle">Inspect → Design → Build → Verify → Document</text>
</svg>