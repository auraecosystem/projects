<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Aura Ecosystem — Projects</title><desc id="desc">A dark aurora-inspired banner for the Aura Ecosystem projects repository.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#11112b"/><stop offset="1" stop-color="#071827"/></linearGradient>
 <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".45" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1600" height="520" rx="36" fill="url(#bg)"/>
<rect width="1600" height="520" rx="36" fill="url(#grid)"/>
<ellipse cx="330" cy="120" rx="300" ry="180" fill="#2563eb" opacity=".24" filter="url(#blur)"/>
<ellipse cx="1250" cy="380" rx="340" ry="210" fill="#7c3aed" opacity=".22" filter="url(#blur)"/>
<path d="M-80 370 C240 170 440 500 760 270 S1230 120 1680 310" fill="none" stroke="url(#aurora)" stroke-width="10" opacity=".42" filter="url(#glow)"/>
<path d="M-80 400 C240 200 440 530 760 300 S1230 150 1680 340" fill="none" stroke="url(#aurora)" stroke-width="2" opacity=".9"/>
<g fill="#fff" opacity=".75"><circle cx="160" cy="92" r="2"/><circle cx="1460" cy="108" r="2"/><circle cx="1320" cy="220" r="1.5"/><circle cx="1020" cy="82" r="1.5"/><circle cx="520" cy="150" r="1.5"/></g>
<g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif" text-anchor="middle">
 <text x="800" y="205" fill="#fff" font-size="76" font-weight="800" letter-spacing="-3">Aura Ecosystem</text>
 <text x="800" y="270" fill="#c4b5fd" font-size="30" font-weight="600">Projects • Playground • Tooling • Experiments</text>
 <text x="800" y="326" fill="#94a3b8" font-size="20">A living workspace for Web4, AI, developer tooling and language infrastructure.</text>
</g>
<rect x="650" y="365" width="300" height="54" rx="27" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
<text x="800" y="400" fill="#e2e8f0" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="18" text-anchor="middle">github.com/auraecosystem/projects</text>
</svg>